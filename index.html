<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#2a2368" />
    <title>HG KART ! ULTRA RACING</title>
    <meta name="description" content="Course de karts 3D arcade : dérapages, mini-turbos, objets et quatre circuits colorés." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      #boot { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; background: radial-gradient(circle at 50% 40%, #4a3cc8, #1a1445 70%); color: #fff; font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif; transition: opacity 0.5s; }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot h1 { margin: 0; text-align: center; font-size: clamp(40px, 9vw, 96px); line-height: 0.95; font-style: italic; font-weight: 800; color: #ffd84a; -webkit-text-stroke: 7px #1a1445; paint-order: stroke fill; text-shadow: 0 7px 0 #ff8a1a, 0 12px 0 #1a1445; transform: rotate(-3deg); }
      #boot h1 span { display: block; color: #fff; font-size: 0.45em; text-shadow: 0 5px 0 #6a58ff, 0 9px 0 #1a1445; }
      #boot-icon { width: 72px; height: 72px; object-fit: contain; border-radius: 18px; box-shadow: 0 5px 0 #1a1445; }
      #boot-track { width: min(340px, 70vw); height: 18px; border-radius: 999px; background: #1a1445; border: 3px solid #fff; overflow: hidden; }
      #boot-bar { width: 8%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #ffe66a, #ff8a1a); transition: width 0.3s; }
      #boot-msg { margin: 0; font-size: 18px; font-weight: 700; }
      #boot-retry { display: none; border: 3px solid #fff; border-radius: 999px; padding: 10px 28px; background: #ff8a1a; color: #1a1445; font: inherit; font-weight: 800; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="boot">
      <h1>HG KART<span>! ULTRA RACING</span></h1>
      <img id="boot-icon" src="/manus-storage/game/sha256/8b7c6219ca1a7ffc8bb38a63cfd69d59831773dfc24a9d2127a096236fff72d4.png" alt="Icône HG KART ! ULTRA RACING" />
      <div id="boot-track"><div id="boot-bar"></div></div>
      <p id="boot-msg">Chargement…</p>
      <button id="boot-retry" onclick="location.reload()">Réessayer</button>
    </div>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
